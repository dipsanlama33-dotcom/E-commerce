<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="header-hero.css" />
    <link rel="stylesheet" href="cart-footer.css">
  </head>
  <body>
    <header class="navbar">
      <div class="logo">ShopEase</div>
      <input type="text" class="search-bar" placeholder="Search products..." />
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#cart" class="cart-icon"
          >🛒 Cart (<span id="cart-count">0</span>)</a
        >
      </div>
    </header>

    <section class="hero">
      <h1>Big Sale - Up to 50% Off!</h1>
      <p>Find the best deals on top quality products today.</p>
    </section>
    <aside class="cart-drawer" id="cart-drawer">
  <h3>Your Shopping Cart</h3>
  <div id="cart-items"><p>Cart is empty.</p></div>
  <div class="cart-total">Total: $<span id="total-price">0.00</span></div>
  <button class="checkout-btn">Checkout</button>
</aside>
<footer>
  <p>2026 ShopEase E-Commerce Project. Built by our team.</p>
</footer>
  <script src="cart.js"></script>
  </body>
</html>
